<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1A1033"><meta name="description" content="Abul AI. Natural Bangla, Banglish and English conversations.">
<link rel="icon" type="image/svg+xml" href="/abul-avatar.svg">
<title>abul.ai</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap');
:root{--bg:#1A1033;--surface:#24183f;--surface-2:#2b1e49;--line:#3a2b59;--text:#fbf7f2;--muted:#b8aecb;--blue:#4D6BFF;--purple:#8A4DF0;--pink:#F23D8C;--accent:#4D6BFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans','Hind Siliguri',sans-serif;min-height:100vh}
.bn{font-family:'Hind Siliguri',sans-serif}
.app{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(138,77,240,.13),transparent 48%),var(--bg)}
.main{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{height:68px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(26,16,51,.88);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.brand img{width:34px;height:34px;border-radius:9px;display:block}
.headtitle{font-size:16px;font-weight:800;letter-spacing:-.55px}
.headtitle span{color:var(--pink)}
.controls{display:flex;align-items:center;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 10px;border-radius:8px;font:inherit;font-size:11px;cursor:pointer}
.pill select{background:transparent;color:inherit;border:0;outline:0;font:inherit}
.pill option{background:#24183f;color:#fff}
.newchat{border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:8px 10px;border-radius:8px;cursor:pointer}
.newchat:hover{color:var(--text);background:var(--surface)}
.chat{flex:1;overflow-y:auto;padding:34px 28px 28px;display:flex;flex-direction:column;gap:24px}
.welcome{max-width:560px;margin:auto;text-align:center;padding:36px 0}
.portrait{width:84px;height:84px;margin:0 auto 22px;border-radius:22px;overflow:hidden;box-shadow:0 12px 45px rgba(77,107,255,.2),0 0 0 1px rgba(242,61,140,.22)}
.portrait img{width:100%;height:100%;display:block}
.welcome h1{font-size:clamp(34px,6vw,48px);letter-spacing:-2px;line-height:1.08;margin:0 0 12px;font-weight:800}
.welcome h1 span{background:linear-gradient(100deg,var(--blue),var(--purple),var(--pink));background-clip:text;-webkit-background-clip:text;color:transparent}
.welcome p{color:var(--muted);line-height:1.7;font-size:13px;margin:0}
.message{display:flex;gap:12px;max-width:720px;width:100%;align-self:flex-start;animation:rise .2s ease}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:32px;height:32px;flex:0 0 32px;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.message:not(.user) .avatar img{width:100%;height:100%;object-fit:cover}
.user .avatar{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;display:grid;place-items:center;font-size:10px;font-weight:700}
.bubble{padding:12px 15px;border-radius:4px 13px 13px 13px;background:var(--surface);border:1px solid var(--line);line-height:1.75;font-size:13px;white-space:pre-wrap;max-width:100%}
.user .bubble{background:linear-gradient(120deg,rgba(77,107,255,.2),rgba(138,77,240,.16));border-color:rgba(138,77,240,.32);border-radius:13px 4px 13px 13px}
.bubble small{display:none}
.typing{color:var(--muted);font-size:12px;padding:10px}
.composer-wrap{padding:14px 28px 20px;border-top:1px solid var(--line);background:rgba(26,16,51,.9)}
.composer{max-width:720px;margin:auto;display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 10px 9px 15px;box-shadow:0 10px 35px rgba(0,0,0,.12)}
.composer:focus-within{border-color:var(--purple);box-shadow:0 0 0 3px rgba(138,77,240,.12)}
.composer textarea{flex:1;resize:none;max-height:130px;min-height:28px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:13px;line-height:1.5;padding:5px 0}
.composer textarea::placeholder{color:#9689ae}
.send{width:36px;height:36px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--purple),var(--pink));color:white;font-size:18px;font-weight:700;cursor:pointer}
.send:disabled{opacity:.45;cursor:not-allowed}
.foot{max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;color:#9589aa;font-size:10px;padding:9px 3px 0}
.foot a{display:none}
.credit{font-size:10px;color:#9589aa;text-align:center;margin-top:9px}
.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.main{max-width:none;min-height:100dvh}header{height:62px;padding:0 16px}.chat{padding:22px 16px}.welcome{padding:24px 0}.welcome h1{letter-spacing:-1.5px}.composer-wrap{padding:12px 14px 17px}.foot{font-size:9px}.brand img{width:30px;height:30px}}
</style>
</head>
<body>
<div class="app">
<main class="main">
<header>
<a class="brand" href="/" aria-label="abul.ai home"><img src="/abul-avatar.svg" alt=""><div class="headtitle">abul<span>.ai</span></div></a>
<div class="controls">
<button class="newchat" id="newChat" type="button">New chat</button>
<label class="pill"><select id="language" aria-label="Language"><option value="both">বাংলা + English</option><option value="bn">বাংলা</option><option value="en">English</option></select></label>
</div>
</header>
<section class="chat" id="chat">
<div class="welcome" id="welcome">
<div class="portrait" aria-hidden="true"><img src="/abul-avatar.svg" alt=""></div>
<h1>Ki obostha, <span>bro?</span></h1>
<p>Bolo. Ki niye kotha bolbi?</p>
</div>
</section>
<div class="composer-wrap">
<form class="composer" id="form">
<textarea id="prompt" rows="1" placeholder="Bolo bro, ki jante chao?" aria-label="Message"></textarea>
<button class="send" id="send" aria-label="Send">↑</button>
</form>
<div class="foot"><span>Enter to send · Shift + Enter for a new line</span><span class="credit">Made by Talha Bhai</span></div>
</div>
</main>
</div>
<script>
const chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),input=document.getElementById('prompt'),form=document.getElementById('form'),send=document.getElementById('send'),lang=document.getElementById('language');
let history=[];
function addMessage(role,text,meta=''){
 const row=document.createElement('div');row.className='message'+(role==='user'?' user':'');
 const avatar=document.createElement('div');avatar.className='avatar';
 if(role==='user'){avatar.textContent='You'}else{const img=document.createElement('img');img.src='/abul-avatar.svg';img.alt='Abul';avatar.append(img)}
 const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;
 if(meta){const small=document.createElement('small');small.textContent=meta;bubble.append(small)}
 row.append(avatar,bubble);chat.append(row);chat.scrollTop=chat.scrollHeight;return row;
}
function showTyping(){const row=document.createElement('div');row.className='message';row.id='typing';const av=document.createElement('div');av.className='avatar';const img=document.createElement('img');img.src='/abul-avatar.svg';img.alt='Abul';av.append(img);const b=document.createElement('div');b.className='bubble typing';b.textContent=lang.value==='bn'?'ভাবছি…':'Thinking…';row.append(av,b);chat.append(row);chat.scrollTop=chat.scrollHeight}
async function submit(q){
 q=(q||input.value).trim();if(!q||send.disabled)return;
 welcome.classList.add('hidden');input.value='';input.style.height='auto';addMessage('user',q);history.push({role:'user',content:q});send.disabled=true;showTyping();
 try{
  const controller=new AbortController();
  const requestTimeout=setTimeout(()=>controller.abort(),30000);
  let response;
  try{response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,language:lang.value}),signal:controller.signal});}
  finally{clearTimeout(requestTimeout)}
  const responseText=await response.text();let data={};
  try{data=responseText?JSON.parse(responseText):{};}catch{throw new Error('Server is temporarily unavailable. Give it a moment and try again, bro.');}
  document.getElementById('typing')?.remove();
  if(!response.ok)throw new Error(data.error||'The AI could not respond.');
  const reply=data.reply||'I could not generate a response. Please try again.';
  history.push({role:'assistant',content:reply});addMessage('assistant',reply);
 }catch(err){document.getElementById('typing')?.remove();const message=err.name==='AbortError'?'Taking too long, bro. Try again.':(err.message||'Connection error. Please try again.');addMessage('assistant',message);history.pop()}
 finally{send.disabled=false;input.focus()}
}
form.addEventListener('submit',e=>{e.preventDefault();submit()});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'});
document.getElementById('newChat').addEventListener('click',()=>{history=[];chat.querySelectorAll('.message').forEach(x=>x.remove());welcome.classList.remove('hidden');input.focus()});
lang.addEventListener('change',()=>{input.placeholder=lang.value==='bn'?'আপনার প্রশ্ন লিখুন…':lang.value==='en'?'Talk to Abul…':'Bolo bro, ki jante chao?'});
</script>
</body>
</html>
