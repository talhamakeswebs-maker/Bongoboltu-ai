<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f5"><meta name="description" content="Abul AI. Bangla, English and bro-code conversations.">
<title>Abul AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap');
:root{--bg:#f7f7f5;--surface:#fff;--line:#e9e9e5;--text:#242521;--muted:#85867f;--accent:#315c48}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans','Hind Siliguri',sans-serif;min-height:100vh}
.bn{font-family:'Hind Siliguri',sans-serif}
.app{min-height:100vh}
.main{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{height:68px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--bg)}
.headtitle{font-size:15px;font-weight:700;letter-spacing:-.35px}
.controls{display:flex;align-items:center;gap:8px}
.pill{border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 10px;border-radius:8px;font:inherit;font-size:11px;cursor:pointer}
.pill select{background:transparent;color:inherit;border:0;outline:0;font:inherit}
.pill option{background:#fff}
.newchat{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:8px;cursor:pointer}
.newchat:hover{color:var(--text)}
.chat{flex:1;overflow-y:auto;padding:34px 28px 28px;display:flex;flex-direction:column;gap:24px}
.welcome{max-width:560px;margin:auto;text-align:center;padding:36px 0}
.portrait{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;background:#e8e8e3;color:#315c48;display:grid;place-items:center;font-weight:700;font-size:22px}.portrait::before{content:'A'}
.welcome h1{font-size:clamp(34px,6vw,48px);letter-spacing:-2px;line-height:1.08;margin:0 0 12px;font-weight:600}
.welcome p{color:var(--muted);line-height:1.7;font-size:13px;margin:0}
.message{display:flex;gap:12px;max-width:720px;width:100%;align-self:flex-start;animation:rise .2s ease}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:#e8e8e3;color:#315c48;display:grid;place-items:center;font-weight:700;overflow:hidden}
.user .avatar{background:#e6e9e4;color:#315c48;display:grid;place-items:center;font-size:10px;font-weight:700}
.bubble{padding:12px 15px;border-radius:4px 13px 13px 13px;background:var(--surface);border:1px solid var(--line);line-height:1.75;font-size:13px;white-space:pre-wrap;max-width:100%}
.user .bubble{background:#edf0eb;border-color:#edf0eb;border-radius:13px 4px 13px 13px}
.bubble small{display:none}
.bubble a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}.bubble a:hover{opacity:.75}
.typing{color:var(--muted);font-size:12px;padding:10px}
.composer-wrap{padding:14px 28px 20px;border-top:1px solid var(--line);background:var(--bg)}
.composer{max-width:720px;margin:auto;display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid #e4e4df;border-radius:12px;padding:9px 10px 9px 15px}
.composer:focus-within{border-color:#aab8ac}
.composer textarea{flex:1;resize:none;max-height:130px;min-height:28px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:13px;line-height:1.5;padding:5px 0}
.composer textarea::placeholder{color:#999a93}
.send{width:36px;height:36px;border:0;border-radius:8px;background:var(--accent);color:white;font-size:18px;cursor:pointer}
.send:disabled{opacity:.45;cursor:not-allowed}
.foot{max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;color:#92938c;font-size:10px;padding:9px 3px 0}
.foot a{display:none}
.credit{font-size:10px;color:#92938c;text-align:center;margin-top:9px}
.hidden{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.main{max-width:none;min-height:100dvh}header{height:62px;padding:0 16px}.chat{padding:22px 16px}.welcome{padding:24px 0}.welcome h1{letter-spacing:-1.5px}.composer-wrap{padding:12px 14px 17px}.foot{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<main class="main">
<header>
<div class="headtitle">Abul AI</div>
<div class="controls">
<button class="newchat" id="clearMemory" type="button" title="Clear saved Maliha conversation memory">Clear memory</button><button class="newchat" id="newChat" type="button">New chat</button>
<label class="pill"><select id="language" aria-label="Language"><option value="both">বাংলা + English</option><option value="bn">বাংলা</option><option value="en">English</option></select></label>
</div>
</header>
<section class="chat" id="chat">
<div class="welcome" id="welcome">
<div class="portrait" aria-hidden="true"></div>
<h1>Ki obostha, bro?</h1>
<p>Bolo. Ki niye kotha bolbi?</p>
</div>
</section>
<div class="composer-wrap">
<form class="composer" id="form">
<textarea id="prompt" rows="1" placeholder="Bolo bro, ki jante chao?" aria-label="Message"></textarea>
<button class="send" id="send" aria-label="Send">↑</button>
</form>
<div class="foot"><span>Enter to send · Shift + Enter for a new line</span><span class="credit">Made by Talha Bhai</span></div>
</div>
</main>
</div>
<script>
const chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),input=document.getElementById('prompt'),form=document.getElementById('form'),send=document.getElementById('send'),lang=document.getElementById('language');
let history=[];
const MALIHA_MEMORY_KEY='abul_maliha_archive_v1';
let malihaActive=false;
let malihaPending=false;
let sessionStarted=false;
function readMalihaArchive(){
 try{const value=JSON.parse(localStorage.getItem(MALIHA_MEMORY_KEY)||'[]');return Array.isArray(value)?value:[]}catch{return []}
}
function getMalihaMemoryContext(){
 return readMalihaArchive().map(item=>(item.role==='assistant'?'Abul: ':'Maliha: ')+String(item.content||'')).join('\n').slice(-12000);
}
function saveMalihaTurn(){
 const archive=readMalihaArchive();
 for(const item of history.slice(-2)){
  if(item&&typeof item.content==='string')archive.push({role:item.role==='assistant'?'assistant':'user',content:item.content.slice(0,1600)});
 }
 try{localStorage.setItem(MALIHA_MEMORY_KEY,JSON.stringify(archive.slice(-80)))}catch{}
}
function identifiesMaliha(text){
 const value=String(text||'').toLowerCase().trim();
 const selfIntro=/(\bi\s*(?:am|'m)\s+(?:maliha|maliha\s+chachi)\b|\bmy\s+name\s+is\s+maliha\b|\bthis\s+is\s+maliha\b|\bmaliha\s+here\b|\bmaliha(?:\s+chachi)?\s+bolchi\b|\bami\s+(?:maliha|talhar\s+chachi)\b|\bamar\s+nam\s+maliha\b|\btalhar\s+chachi\b|\btalha\s+chachar\s+chachi\b|আমি\s+মালিহা|আমার\s+নাম\s+মালিহা|আমি\s+তালহার\s+চাচি)/i.test(value);
 const shortIntro=/^(maliha|maliha\s+chachi|ami\s+maliha|আমি\s+মালিহা)[!.?,\s]*$/i.test(value);
 const chachaAddress=/(\btalha\s+chacha(?:r|ke|re)?\b|তালহা\s+চাচা(?:র|কে|রে)?)/i.test(value);
 return selfIntro||shortIntro||chachaAddress;
}
function confirmsMaliha(text){
 return /^(yes|yeah|yep|yup|correct|that's me|thats me|right|haan|ha|hmm|ji|হ্যাঁ|জি|ঠিক|আমিই|ami)[!.?,\s]*$/i.test(String(text||'').trim());
}
function clearMalihaMemory(){try{localStorage.removeItem(MALIHA_MEMORY_KEY)}catch{}}
function renderRichText(element,text){
 const pattern=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<]+)/g;
 let last=0,match;
 while((match=pattern.exec(text))!==null){
  element.append(document.createTextNode(text.slice(last,match.index)));
  let label=match[1]||match[3],url=match[2]||match[3],suffix='';
  if(!match[1]){while(/[.,!?;:)]$/.test(url)){suffix=url.slice(-1)+suffix;url=url.slice(0,-1)}}
  if(url){
   const a=document.createElement('a');a.href=url;a.textContent=label;a.target='_blank';a.rel='noopener noreferrer';a.referrerPolicy='no-referrer';element.append(a);
   if(suffix)element.append(document.createTextNode(suffix));
  }else{element.append(document.createTextNode(match[0]))}
  last=pattern.lastIndex;
 }
 element.append(document.createTextNode(text.slice(last)));
}
function addMessage(role,text,meta=''){
 const row=document.createElement('div');row.className='message'+(role==='user'?' user':'');
 const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'You':'';
 const bubble=document.createElement('div');bubble.className='bubble';renderRichText(bubble,text);
 if(meta){const small=document.createElement('small');small.textContent=meta;bubble.append(small)}
 row.append(avatar,bubble);chat.append(row);chat.scrollTop=chat.scrollHeight;return row;
}
function showTyping(){const row=document.createElement('div');row.className='message';row.id='typing';const av=document.createElement('div');av.className='avatar';const b=document.createElement('div');b.className='bubble typing';b.textContent=lang.value==='bn'?'ভাবছি…':'Thinking…';row.append(av,b);chat.append(row);chat.scrollTop=chat.scrollHeight}
async function submit(q){
 q=(q||input.value).trim();if(!q||send.disabled)return;
 if(!sessionStarted&&identifiesMaliha(q)){malihaPending=true;}else if(malihaPending&&confirmsMaliha(q)){malihaActive=true;malihaPending=false;}else if(identifiesMaliha(q)){malihaActive=true;}
 welcome.classList.add('hidden');input.value='';input.style.height='auto';addMessage('user',q);history.push({role:'user',content:q});send.disabled=true;showTyping();
 try{
  const controller=new AbortController();
  const requestTimeout=setTimeout(()=>controller.abort(),45000);
  let response;
  try{
   response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,language:lang.value,isMalihaSession:malihaActive,isMalihaCandidate:malihaPending,isNewSession:!sessionStarted,malihaMemory:malihaActive?getMalihaMemoryContext():''}),signal:controller.signal});
  }finally{clearTimeout(requestTimeout)}
  const responseText=await response.text();
  let data={};
  try{data=responseText?JSON.parse(responseText):{};}catch{throw new Error('Server is temporarily unavailable. Give it a moment and try again, bro.');}
  document.getElementById('typing')?.remove();
  if(!response.ok)throw new Error(data.error||'The AI could not respond.');
  const reply=data.reply||'I could not generate a response. Please try again.';
  history.push({role:'assistant',content:reply});addMessage('assistant',reply);
  sessionStarted=true;
  if(malihaActive)saveMalihaTurn();
 }catch(err){document.getElementById('typing')?.remove();const message=err.name==='AbortError'?'Taking too long, bro. Try again.':(err.message||'Connection error. Please try again.');addMessage('assistant',message);history.pop()}
 finally{send.disabled=false;input.focus()}
}
form.addEventListener('submit',e=>{e.preventDefault();submit()});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'});
document.getElementById('newChat').addEventListener('click',()=>{history=[];malihaActive=false;malihaPending=false;sessionStarted=false;chat.querySelectorAll('.message').forEach(x=>x.remove());welcome.classList.remove('hidden');input.focus()});
document.getElementById('clearMemory').addEventListener('click',()=>{if(window.confirm('Clear Abul’s saved Maliha conversation memory from this browser? This cannot be undone.')){clearMalihaMemory();window.alert('Saved browser memory cleared.');}});
lang.addEventListener('change',()=>{input.placeholder=lang.value==='bn'?'আপনার প্রশ্ন লিখুন…':lang.value==='en'?'Talk to Abul…':'Bolo bro, ki jante chao?'});
</script>
</body>
</html>
